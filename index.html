
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laços da Vida | Novela Oficial</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #100c19;
      color: #fff;
      font-family: Georgia, serif;
    }
    header {
      padding: 24px;
      text-align: center;
      background: #21132d;
      border-bottom: 2px solid #c6a46a;
    }
    header h1 {
      color: #e9ca91;
      letter-spacing: 3px;
      margin: 0;
    }
    .hero {
      padding: 100px 20px;
      text-align: center;
      background: linear-gradient(135deg, #46264c, #100c19);
    }
    .hero h2 { font-size: 38px; }
    .hero p {
      max-width: 550px;
      margin: 20px auto;
      line-height: 1.7;
    }
    section {
      max-width: 900px;
      margin: auto;
      padding: 45px 20px;
    }
    .card {
      background: #251a32;
      padding: 25px;
      border-radius: 12px;
      margin-top: 20px;
    }
    .card h3 { color: #e9ca91; }
    footer {
      text-align: center;
      padding: 25px;
      background: #21132d;
    }
  </style>
</head>
<body>
  <header>
    <h1>LAÇOS DA VIDA</h1>
    <p>Uma história de amor, família e destinos</p>
  </header>

  <div class="hero">
    <h2>Bem-vindo à nossa história</h2>
    <p>
      Entre encontros, segredos e emoções,
      cada escolha pode mudar uma vida.
      Descubra os laços que unem nossos destinos.
    </p>
  </div>

  <section>
    <h2>Capítulos da novela</h2>
    <div id="capitulos">
      <div class="card">
        <h3>Em breve</h3>
        <p>Os capítulos estarão disponíveis aqui.</p>
      </div>
    </div>
  </section>

  <footer>
    Laços da Vida © 2026
  </footer>
</body>
</html>
